name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  DBT_PROFILES_DIR: ${{ github.workspace }}/transform
  NBA_DUCKDB_PATH: ${{ github.workspace }}/data/nba.duckdb

jobs:
  lint:
    name: Lint and Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: cd transform && uv run dbt deps
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit (ruff, sqlfluff, dbt-checkpoint)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Ingestion unit tests
        run: uv run pytest

  dbt-build:
    name: dbt build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBT_TARGET: ci
      # Every PR builds into its own schemas (ci_pr_<n>_bronze, ...).
      CI_SCHEMA_SUFFIX: ${{ github.event.pull_request.number && format('pr_{0}', github.event.pull_request.number) || 'main' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Ingest current season
        run: uv run nba-ingest
      - run: cd transform && uv run dbt deps
      - name: dbt build (models, unit tests, data tests)
        run: cd transform && uv run dbt build
      - name: Semantic layer validation (MetricFlow, against the warehouse)
        run: cd transform && uv run mf validate-configs
      - name: Known-answer metric tests (MetricFlow vs independent SQL)
        run: uv run python scripts/check_metrics.py
      - name: Source freshness
        # Non-blocking: a stale upstream should alert, not block unrelated PRs.
        continue-on-error: true
        run: cd transform && uv run dbt source freshness
      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dbt-artifacts-${{ github.run_id }}
          path: |
            transform/target/manifest.json
            transform/target/run_results.json
            transform/target/sources.json
            transform/target/semantic_manifest.json
          retention-days: 14
