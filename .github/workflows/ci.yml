name: CI

# Four checks (ADR 0005):
#   Lint & unit tests   required   static checks and Python tests; no data needed
#   dbt build           required   Slim CI build + tests, contracts and breaking-change guard,
#                                  MetricFlow validation, known-answer metric checks
#   Project structure   required   dbt-project-evaluator; needs no data, runs alongside dbt build
#   Data diff           advisory   Recce comment and source freshness; never blocks a merge
#
#   Lint & unit tests ──┬─► dbt build ──► Data diff (PRs)
#                       └─► Project structure

on:
  pull_request:
    # labeled/unlabeled: re-run when a reviewer adds or removes approved-breaking-change
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"
  DBT_PROFILES_DIR: ${{ github.workspace }}/transform
  NBA_DUCKDB_PATH: ${{ github.workspace }}/data/nba.duckdb
  DBT_TARGET: ci
  # Every PR builds into its own schemas (ci_pr_<n>_bronze, ...); main builds ci_main_*.
  CI_SCHEMA_SUFFIX: ${{ github.event.pull_request.number && format('pr_{0}', github.event.pull_request.number) || 'main' }}

jobs:
  lint:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: cd transform && uv run dbt deps
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit (gitleaks, ruff, sqlfluff, dbt-checkpoint, metric governance)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Python unit tests (ingestion, metric governance)
        run: uv run pytest
      - name: Airflow DAG integrity tests
        env:
          # pre-commit's dbt parse wrote the manifest Cosmos renders from
          NBA_DBT_MANIFEST: ${{ github.workspace }}/transform/target/lint/manifest.json
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: |
          export AIRFLOW_HOME="$RUNNER_TEMP/airflow"
          cd orchestration && uv sync --locked && uv run airflow db migrate > /dev/null && uv run pytest

  build:
    name: dbt build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # download main's baseline artifact
    env:
      ALLOW_BREAKING_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'approved-breaking-change') }}
    outputs:
      baseline: ${{ steps.baseline.outputs.dir != '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # to diff the PR against its base
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: cd transform && uv run dbt deps

      # Slim CI baseline: main's last successful CI run saved its built DuckDB file and dbt
      # artifacts. PRs defer unchanged models to it instead of rebuilding them. No secrets needed.
      - name: Fetch main's baseline
        id: baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF...HEAD")
          if echo "$changed" | grep -qE '^(ingestion/|pyproject\.toml|uv\.lock)'; then
            echo "::notice::Ingestion or dependencies changed: running a full build."
            exit 0
          fi
          run_id=$(gh run list --workflow ci.yml --branch main --event push --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -n "$run_id" ] && gh run download "$run_id" --name ci-baseline --dir baseline; then
            mkdir -p data && mv baseline/nba.duckdb data/nba.duckdb
            echo "dir=$GITHUB_WORKSPACE/baseline" >> "$GITHUB_OUTPUT"
            echo "Using baseline from run $run_id"
          else
            echo "::notice::No baseline from main yet: running a full build."
          fi

      - name: Ingest current season
        if: steps.baseline.outputs.dir == ''
        run: uv run nba-ingest

      - name: dbt build, breaking-change guard, semantic layer checks
        env:
          BASELINE_DIR: ${{ steps.baseline.outputs.dir }}
        run: scripts/ci_dbt.sh build

      - name: Generate catalog
        run: cd transform && uv run dbt docs generate

      # Hand the built warehouse to the Data diff job (PRs) or keep it as the baseline (main).
      - name: Stage build output
        run: |
          out="$RUNNER_TEMP/build-output"
          mkdir -p "$out/base"
          cp data/nba.duckdb transform/target/manifest.json transform/target/catalog.json "$out/"
          if [ -d baseline ]; then cp baseline/manifest.json baseline/catalog.json "$out/base/"; fi
      - name: Save baseline for PRs (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-baseline
          path: |
            ${{ runner.temp }}/build-output/nba.duckdb
            ${{ runner.temp }}/build-output/manifest.json
            ${{ runner.temp }}/build-output/catalog.json
          retention-days: 30
      - name: Save PR build for the data diff
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pr-build
          path: ${{ runner.temp }}/build-output/
          retention-days: 7
      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dbt-artifacts-${{ github.run_id }}
          path: |
            transform/target/manifest.json
            transform/target/run_results.json
            transform/target/semantic_manifest.json
          retention-days: 14

  structure:
    name: Project structure
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: cd transform && uv run dbt deps
      - name: dbt-project-evaluator (reads the project graph; no data needed)
        run: mkdir -p data && scripts/ci_dbt.sh structure

  data-diff:
    name: Data diff (advisory)
    needs: build
    if: github.event_name == 'pull_request'
    # Advisory: shows red if Recce or freshness fails, but never fails the workflow or a merge.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # post the data diff comment
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: cd transform && uv run dbt deps
      - uses: actions/download-artifact@v8.0.2
        with:
          name: pr-build
          path: pr-build
      - name: Restore the PR's built warehouse
        run: |
          mkdir -p data transform/target
          mv pr-build/nba.duckdb data/nba.duckdb
          cp pr-build/manifest.json pr-build/catalog.json transform/target/

      - name: Source freshness
        run: cd transform && uv run dbt source freshness

      - name: Recce data diff vs main
        if: needs.build.outputs.baseline == 'true'
        env:
          RECCE_DISABLE_TELEMETRY: "1"
        run: |
          cd transform
          uv run recce run --target-path target --target-base-path ../pr-build/base \
            --output "$RUNNER_TEMP/recce_state.json" --summary "$RUNNER_TEMP/recce_summary.md"
          {
            echo '<!-- recce-data-diff -->'
            head -c 60000 "$RUNNER_TEMP/recce_summary.md"
            echo
            echo '_Data diff of this PR vs main. Explore it: download the recce-state artifact, then run `recce server --review recce_state.json`._'
          } > "$RUNNER_TEMP/comment.md"
      - name: Post data diff on the PR
        if: needs.build.outputs.baseline == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --edit-last --create-if-none --body-file "$RUNNER_TEMP/comment.md"
      - name: Upload Recce state
        if: needs.build.outputs.baseline == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: recce-state
          path: ${{ runner.temp }}/recce_state.json
          retention-days: 14
      - name: No baseline yet
        if: needs.build.outputs.baseline != 'true'
        run: echo "::notice::Full build (no baseline or ingestion changed), so there is nothing to diff against."
