# Saved queries are the governed, reusable questions: BI tools, scheduled exports and the
# known-answer checks in scripts/check_metrics.py all go through these instead of ad-hoc SQL.

saved_queries:
  - name: team_ratings_by_season
    label: Team ratings by season
    description: Results, efficiency and four-factor style metrics per team per season and season type.
    query_params:
      metrics:
        - games_played
        - win_pct
        - offensive_rating
        - defensive_rating
        - net_rating
        - pace
        - effective_fg_pct
        - true_shooting_pct
        - turnover_rate
        - offensive_rebound_pct
      group_by:
        - "Dimension('team__team_abbreviation')"
        - "Dimension('team_game__season')"
        - "Dimension('team_game__season_type')"
      # Standings-style numbers: the NBA Cup final does not count toward a team's record.
      where:
        - "{{ Dimension('team_game__counts_toward_record') }}"
    config:
      meta: {owner: analytics_engineering}

  - name: league_shot_profile
    label: League shot profile by zone
    description: Attempts, accuracy and value of shots by court zone per season.
    query_params:
      metrics:
        - shot_attempts
        - shot_fg_pct
        - points_per_shot
      group_by:
        - "Dimension('shot__shot_zone')"
        - "Dimension('shot__season')"
    config:
      meta: {owner: basketball_analytics}

  - name: possession_efficiency_by_start
    label: Possession efficiency by how it started
    description: Points per possession and possession length by start reason per season.
    query_params:
      metrics:
        - avg_possession_seconds
        - second_chance_conversion_rate
      group_by:
        - "Dimension('possession__start_reason')"
        - "Dimension('possession__season')"
    config:
      meta: {owner: basketball_analytics}
