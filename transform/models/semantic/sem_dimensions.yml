semantic_models:
  - name: teams
    description: NBA franchises (gold dim_teams). Adds team names to any metric grouped by team.
    model: ref('dim_teams')
    entities:
      - name: team
        type: primary
        expr: team_id
    dimensions:
      - name: team_abbreviation
        type: categorical
      - name: team_display_name
        type: categorical

  - name: games
    description: Scheduled games (gold dim_games, latest version). Adds venue and game-type context.
    model: ref('dim_games')
    entities:
      - name: game
        type: primary
        expr: game_id
    dimensions:
      - name: game_type
        type: categorical
      - name: is_neutral_site
        type: categorical
      - name: venue_city
        type: categorical
      - name: broadcast_network
        type: categorical

  - name: players
    description: >
      Player versions (gold dim_players, type 2). MetricFlow joins the version that was valid at
      each fact's metric_time, so a traded player's stats group under the right attributes.
    model: ref('dim_players')
    primary_entity: player
    defaults:
      agg_time_dimension: valid_from
    entities:
      - name: player
        type: natural
        expr: player_id
    dimensions:
      - name: valid_from
        type: time
        type_params:
          time_granularity: day
          validity_params:
            is_start: true
      - name: valid_to
        type: time
        type_params:
          time_granularity: day
          validity_params:
            is_end: true
      - name: player_name
        type: categorical
      - name: position
        type: categorical
