models:
  - name: int_games_classified
    description: >
      One row per scheduled game with business classifications: playoff round, All-Star and NBA
      Cup championship flags, whether the game counts toward team records, the US Eastern game
      date the league uses, and the winner.
    columns:
      - name: game_id
        description: ESPN game id. Primary key.
        data_tests: [unique, not_null]
      - name: game_date
        description: Game date in US Eastern time.
        data_tests: [not_null]
      - name: counts_toward_record
        description: False for All-Star games and the NBA Cup championship.
      - name: winning_team_id
        description: NULL until the game is final.

  - name: int_players_latest
    description: >
      One row per known player: everyone on a current-season roster plus everyone with a box
      score. Team, jersey and position come from the current roster when the player is on one,
      so signings and trades appear before the player's next game. Players on no roster have a
      NULL team_id. Feeds the snap_players snapshot.
    columns:
      - name: player_id
        description: ESPN athlete id. Primary key.
        data_tests: [unique, not_null]
      - name: player_name
        data_tests: [not_null]
      - name: team_id
        description: Current roster team; NULL when the player is on no roster (free agent, retired).
        data_tests:
          - not_null:
              config:
                where: is_on_current_roster
      - name: is_on_current_roster
        description: True when the player is on a current-season roster.
        data_tests: [not_null]
      - name: last_game_team_id
        description: Team in the player's most recent game; NULL if they have not played.
