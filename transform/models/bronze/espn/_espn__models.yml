models:
  - name: stg_espn__games
    description: >
      One row per scheduled game, including future, postponed, playoff, play-in, NBA Cup and
      All-Star games. Scores are NULL until the game is played.
    columns:
      - name: game_id
        description: ESPN game id. Primary key.
        data_tests: [unique, not_null]
      - name: home_team_id
        data_tests: [not_null]
      - name: away_team_id
        data_tests: [not_null]
      - name: season_type
        description: regular_season, playoffs or play_in.
        data_tests:
          - accepted_values:
              arguments:
                values: ["regular_season", "playoffs", "play_in"]
      - name: game_type_code
        description: >
          ESPN game type. STD regular game, RD16/QTR/SEMI/FINAL playoff rounds, CC NBA Cup
          championship, ALLSTAR All-Star events.
      - name: game_status
        description: scheduled, in_progress, final, postponed, canceled (ESPN STATUS_* lowercased).
        data_tests:
          - accepted_values:
              arguments:
                values: ["scheduled", "in_progress", "halftime", "end_period", "final", "postponed", "canceled", "delayed"]
      - name: scheduled_start_at_utc
        description: Scheduled tip-off, UTC.
        data_tests: [not_null]
      - name: home_score
        description: Final home score; NULL before the game.
      - name: away_score
        description: Final away score; NULL before the game.

  - name: stg_espn__player_boxscores
    description: One row per player per game, including players who did not play.
    columns:
      - name: player_game_id
        description: Surrogate key of game_id and player_id. Primary key.
        data_tests: [unique, not_null]
      - name: game_id
        data_tests: [not_null]
      - name: player_id
        description: ESPN athlete id.
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: plus_minus
        description: Point differential while on court, parsed from ESPN text like '+2'.
      - name: minutes_played
        description: Minutes played; NULL when the player did not play.

  - name: stg_espn__team_boxscores
    description: One row per team per game (two rows per completed game).
    columns:
      - name: team_game_id
        description: Surrogate key of game_id and team_id. Primary key.
        data_tests: [unique, not_null]
      - name: game_id
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: turnovers
        description: All turnovers, including team turnovers such as shot-clock violations.
      - name: player_turnovers
        description: Turnovers credited to individual players.

  - name: stg_espn__rosters
    description: >
      One row per player on a team's roster per season, as of the publisher's last refresh.
      Height and weight are parsed from ESPN text (6' 5", 205 lbs).
    columns:
      - name: player_id
        description: ESPN athlete id (sent as text, cast to integer).
        data_tests: [not_null]
      - name: team_id
        data_tests: [not_null]
      - name: season
        data_tests: [not_null]
      - name: roster_status
        description: ESPN status type, e.g. active.
      - name: height_inches
        description: Height in inches.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 66
                max_value: 96
              config:
                where: height_inches is not null
      - name: weight_lbs
        description: Weight in pounds.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, player_id]

  - name: stg_espn__plays
    description: >
      Play-by-play events, one row per play. Renamed and typed from the raw ESPN feed; no business
      logic. Times are UTC. Shot coordinates are feet from center court (x along the 94 ft length,
      y along the 50 ft width) and are NULL for non-shooting plays.
    columns:
      - name: play_id
        description: ESPN play id. Primary key.
        data_tests:
          - unique
          - not_null
      - name: game_id
        description: ESPN game id.
        data_tests:
          - not_null
      - name: season
        description: ESPN season label; the 2025-26 season is 2026.
        data_tests:
          - not_null
      - name: season_type
        description: regular_season, playoffs or play_in, mapped from ESPN season_type codes.
        data_tests:
          - accepted_values:
              arguments:
                values: ["regular_season", "playoffs", "play_in"]
      - name: sequence_number
        description: >
          ESPN event sequence. Not chronological: the running score goes backwards thousands of
          times in this order. Use game_play_number (or silver play_index) to order plays.
      - name: game_play_number
        description: Chronological play order within a game.
        data_tests: [not_null]
      - name: play_type_id
        description: ESPN play type id. Every id must be classified in the play_type_categories seed.
        data_tests:
          - relationships:
              arguments:
                to: ref('play_type_categories')
                field: play_type_id
              config:
                # A new upstream play type should be classified, but must not stop prod runs.
                severity: warn
                tags: ["schema_drift"]
                where: play_type_id <> 0
      - name: period
        description: 1-4 for quarters, 5+ for overtimes.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 10
      - name: play_type
        description: Play type label with whitespace normalized, e.g. 'Bad Pass Turnover'.
        data_tests:
          - not_null
      - name: points_scored
        description: Points scored on this play (0 if none).
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
              config:
                where: points_scored is not null
      - name: shot_x
        description: Shot location along the court length in feet from center; NULL if not a shot.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -47
                max_value: 47
              config:
                where: shot_x is not null
      - name: shot_y
        description: Shot location along the court width in feet from center; NULL if not a shot.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -25
                max_value: 25
              config:
                where: shot_y is not null
      - name: game_start_at_utc
        description: Scheduled tip-off, UTC.
      - name: wallclock_at_utc
        description: Real-world time the play was logged, UTC.
      - name: _loaded_at
        description: When our loader wrote the row.
      - name: _source_published_at
        description: When the publisher last refreshed the file this row came from.

unit_tests:
  - name: test_stg_espn__plays_cleans_labels_and_coordinates
    description: >
      Season type codes map to labels, embedded line breaks are removed from play types, the
      non-shot coordinate sentinel becomes NULL, and timestamps are normalized to UTC.
    model: stg_espn__plays
    given:
      - input: source('espn', 'espn_nba_plays')
        rows:
          - id: 1
            game_id: 10
            season_type: 3
            type_text: "Bad Pass\nTurnover"
            shooting_play: false
            coordinate_x: -214748406.75
            coordinate_y: -214748365.0
            clock_minutes: 11
            clock_seconds: 35.0
            game_date_time: "2026-06-13 17:30:00-07:00"
            wallclock: "2026-06-14T00:43:47Z"
          - id: 2
            game_id: 10
            season_type: 5
            type_text: "Jump Shot"
            shooting_play: true
            coordinate_x: 20.5
            coordinate_y: -3.0
            clock_minutes: 0
            clock_seconds: 4.2
            game_date_time: "2026-06-13 17:30:00-07:00"
            wallclock: "not a timestamp"
    expect:
      rows:
        - play_id: 1
          season_type: playoffs
          play_type: Bad Pass Turnover
          shot_x: null
          shot_y: null
          period_seconds_remaining: 695.0
          game_start_at_utc: "2026-06-14 00:30:00"
          wallclock_at_utc: "2026-06-14 00:43:47"
        - play_id: 2
          season_type: play_in
          play_type: Jump Shot
          shot_x: 20.5
          shot_y: -3.0
          period_seconds_remaining: 4.2
          game_start_at_utc: "2026-06-14 00:30:00"
          wallclock_at_utc: null
