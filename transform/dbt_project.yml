name: nba
version: "0.1.0"
config-version: 2
profile: nba

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

flags:
  require_generic_test_arguments_property: true

vars:
  # ESPN season_type codes -> readable labels, shared by bronze models and tests.
  season_types:
    2: regular_season
    3: playoffs
    5: play_in
  # Calendar range for dim_date and the first fct_shots microbatch.
  date_spine_start: "2024-08-01"
  date_spine_end: "2027-08-01"
  # Days of games fct_possessions reprocesses on each incremental run (stat corrections).
  possession_lookback_days: 3

models:
  nba:
    # Medallion layers. See STYLE_GUIDE.md for what belongs in each.
    bronze:
      +schema: bronze
      +materialized: view
      +access: protected
    silver:
      +schema: silver
      +materialized: table
      +access: protected
    gold:
      +schema: gold
      +materialized: table
      +access: public
      # Gold is the interface consumers and MetricFlow depend on: names and types are enforced.
      +contract:
        enforced: true

data_tests:
  nba:
    +store_failures: false
