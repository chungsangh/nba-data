[project]
name = "nba-data"
version = "0.1.0"
description = "NBA analytics engineering reference project: dbt + MetricFlow on DuckDB/MotherDuck, orchestrated with Airflow."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.12,<2",
    "dbt-duckdb>=1.11,<2",
    "dbt-metricflow>=0.15",
    "duckdb>=1.3,<2",
    "httpx>=0.28",
    "tenacity>=9",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.8",
    "sqlfluff>=3.4",
    "sqlfluff-templater-dbt>=3.4",
]

[project.scripts]
nba-ingest = "ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "scripts/tests"]
